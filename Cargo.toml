[package]
name = "whoknocked"
version = "0.4.0"
edition = "2021"
rust-version = "1.74"
description = "Who knocked on your SSH door? A tiny local analyzer for Linux auth logs that surfaces brute force, sprays, and suspicious logins."
license = "MIT"
readme = "README.md"
repository = "https://github.com/tdiprima/whoknocked"
keywords = ["security", "siem", "ssh", "logs", "bruteforce"]
categories = ["command-line-utilities"]

[[bin]]
name = "whoknocked"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
regex = "1.10"

[profile.release]
strip = true
lto = true
