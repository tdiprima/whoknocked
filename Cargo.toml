[package]
name = "loghound"
version = "0.3.0"
edition = "2021"
rust-version = "1.74"
description = "A tiny local SIEM-style analyzer for Linux SSH/sudo authentication logs"
license = "MIT"
readme = "README.md"
repository = "https://github.com/tdiprima/loghound"
keywords = ["security", "siem", "ssh", "logs", "bruteforce"]
categories = ["command-line-utilities"]

[[bin]]
name = "loghound"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
regex = "1.10"

[profile.release]
strip = true
lto = true
